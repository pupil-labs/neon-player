[mypy]
python_version = 3.12
packages = pupil_labs.neon_player
mypy_path = src
strict = true
warn_unreachable = true
show_error_codes = true
explicit_package_bases = True

# These installed dependencies do not provide stubs or a py.typed marker.
[mypy-AppKit,numpyencoder,pupil_apriltags,pyxdf,pyqtgraph.*]
ignore_missing_imports = true
