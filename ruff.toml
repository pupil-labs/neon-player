target-version = "py312"
fix = true
unsafe-fixes = false
preview = false
exclude = [
    "docs/examples/",
]

[lint]
extend-select = [
    # Style and imports
    "E",       # PEP 8 errors
    "W",       # PEP 8 warnings
    "I",       # Sort and organize imports
    "Q",       # Consistent quotes
    "ISC",     # Flag implicit string concatenation

    # Correctness
    "F",       # Undefined names, unused imports, and related errors
    "B",       # Common bugs and risky patterns
    "A",       # Prevent shadowing builtins
    "PLC",     # Pylint conventions
    "PLE",     # Pylint errors
    "PLW",     # Pylint warnings
    "RUF",     # Ruff-specific checks

    # Modernization and compatibility
    "UP",      # Modern Python syntax and APIs
    "YTT",     # Reliable Python version checks

    # Simplification and complexity
    "SIM",     # Simplify control flow and expressions
    "C4",      # Simplify comprehensions
    "PIE",     # Remove unnecessary code
    "RSE",     # Remove redundant exception parentheses
    "C90",     # Limit cyclomatic complexity

    # Types and unused parameters
    "ANN",     # Require function annotations
    "ARG",     # Flag unused arguments

    # API-specific checks
    "DTZ",     # Flag timezone-naive datetime usage
    "LOG",     # Correct logging usage
    "NPY",     # NumPy best practices and compatibility
    "PD",      # pandas best practices

    # Security and debugging
    "S",       # Detect potential security issues
    "T10",     # Detect leftover debugger calls

    # Testing
    "PT",      # Consistent pytest usage
    "PGH005",  # Detect uncalled mock assertions

    # Performance
    "PERF",    # Flag avoidable performance costs

    # Explicit suppressions
    "PGH003",  # Require specific type-ignore codes
    "PGH004",  # Require specific noqa codes
]
ignore = [
    # Indentation
    "W191",  # Disallow tabs in indentation

    # Security
    "S101",  # Flag assert statements, which Python can disable with -O
]

[format]
preview = false
quote-style = "double"
